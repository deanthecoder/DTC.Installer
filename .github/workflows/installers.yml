name: Build Installers

on:
  workflow_call:
    inputs:
      version:
        description: "Installer version, e.g. 0.1"
        required: true
        type: string
      build_windows:
        description: "Build the Windows/Inno Setup installer."
        required: false
        default: true
        type: boolean
      build_macos:
        description: "Build the macOS DMG installer."
        required: false
        default: true
        type: boolean
      artifact_name_prefix:
        description: "Optional artifact name prefix. Defaults to the caller repository name."
        required: false
        default: ""
        type: string
      artifact_retention_days:
        description: "Number of days to retain uploaded installer artifacts."
        required: false
        default: 14
        type: number
      create_tag:
        description: "Create and push a v-prefixed git tag after successful builds."
        required: false
        default: true
        type: boolean

jobs:
  windows:
    name: Build Windows installer
    if: ${{ inputs.build_windows }}
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            8.0.x
            9.0.x

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Install Inno Setup
        run: choco install innosetup --version=6.3.3 --allow-downgrade --yes --no-progress

      - name: Build installer
        run: python Installer/pack.py --version "${{ inputs.version }}"
        env:
          DTC_INSTALLER_OUTPUT_DIR: C:\dtc-installer-output

      - name: Upload installer artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.artifact_name_prefix || github.event.repository.name }}-windows-installer-${{ inputs.version }}
          path: dist/win/*.exe
          if-no-files-found: error
          retention-days: ${{ inputs.artifact_retention_days }}

  macos:
    name: Build macOS DMGs
    if: ${{ inputs.build_macos }}
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            8.0.x
            9.0.x

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Build DMGs
        run: python Installer/pack.py --version "${{ inputs.version }}"

      - name: Upload DMG artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.artifact_name_prefix || github.event.repository.name }}-macos-dmgs-${{ inputs.version }}
          path: dist/mac/*.dmg
          if-no-files-found: error
          retention-days: ${{ inputs.artifact_retention_days }}

  tag:
    name: Tag release
    needs:
      - windows
      - macos
    if: ${{ always() && !cancelled() && inputs.create_tag && (inputs.build_windows || inputs.build_macos) && (needs.windows.result == 'success' || needs.windows.result == 'skipped') && (needs.macos.result == 'success' || needs.macos.result == 'skipped') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: false

      - name: Create version tag
        shell: bash
        run: |
          set -euo pipefail
          tag="v${{ inputs.version }}"
          if git rev-parse --verify --quiet "refs/tags/${tag}" >/dev/null; then
            echo "Tag ${tag} already exists."
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "${tag}" -m "${tag}"
          git push origin "${tag}"
