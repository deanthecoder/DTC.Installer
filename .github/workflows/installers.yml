name: Build Installers

on:
  workflow_call:
    inputs:
      version:
        description: "Installer version, e.g. 0.1"
        required: true
        type: string
      build_windows:
        description: "Build the Windows/Inno Setup installer."
        required: false
        default: true
        type: boolean
      build_macos:
        description: "Build the macOS DMG installer."
        required: false
        default: true
        type: boolean
      artifact_name_prefix:
        description: "Optional artifact name prefix. Defaults to the caller repository name."
        required: false
        default: ""
        type: string
      artifact_retention_days:
        description: "Number of days to retain uploaded installer artifacts."
        required: false
        default: 14
        type: number
      create_release:
        description: "Create a GitHub release with generated notes and installer files after successful builds."
        required: false
        default: true
        type: boolean

jobs:
  windows:
    name: Build Windows installer
    if: ${{ inputs.build_windows }}
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            8.0.x
            9.0.x

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Install Inno Setup
        run: choco install innosetup --version=6.3.3 --allow-downgrade --yes --no-progress

      - name: Build installer
        run: python Installer/pack.py --version "${{ inputs.version }}"
        env:
          DTC_INSTALLER_OUTPUT_DIR: C:\dtc-installer-output

      - name: Upload installer artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.artifact_name_prefix || github.event.repository.name }}-windows-installer-${{ inputs.version }}
          path: dist/win/*.exe
          if-no-files-found: error
          retention-days: ${{ inputs.artifact_retention_days }}

  macos:
    name: Build macOS DMGs
    if: ${{ inputs.build_macos }}
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            8.0.x
            9.0.x

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Build DMGs
        run: python Installer/pack.py --version "${{ inputs.version }}"

      - name: Upload DMG artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.artifact_name_prefix || github.event.repository.name }}-macos-dmgs-${{ inputs.version }}
          path: dist/mac/*.dmg
          if-no-files-found: error
          retention-days: ${{ inputs.artifact_retention_days }}

  release:
    name: Create release
    needs:
      - windows
      - macos
    if: ${{ always() && !cancelled() && inputs.create_release && (inputs.build_windows || inputs.build_macos) && (needs.windows.result == 'success' || needs.windows.result == 'skipped') && (needs.macos.result == 'success' || needs.macos.result == 'skipped') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download installer artifacts
        uses: actions/download-artifact@v7
        with:
          pattern: ${{ inputs.artifact_name_prefix || github.event.repository.name }}-*-${{ inputs.version }}
          path: release-assets
          merge-multiple: true

      - name: Create GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          tag="v${VERSION}"
          repo_name="${GITHUB_REPOSITORY#*/}"
          if gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${tag}" >/dev/null 2>&1; then
            echo "Tag ${tag} already exists."
            exit 1
          fi
          mapfile -t installers < <(find release-assets -type f \( -name '*.exe' -o -name '*.dmg' \) -print | sort)
          if [ "${#installers[@]}" -eq 0 ]; then
            echo "No installer files were downloaded."
            exit 1
          fi
          gh release create "${tag}" "${installers[@]}" \
            --repo "${GITHUB_REPOSITORY}" \
            --target "${GITHUB_SHA}" \
            --title "${repo_name} ${tag}" \
            --generate-notes
